<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <script src="users.js" defer></script>
</head>
<body>
    <header>
        <h1>User Directory</h1>
        <p>Explore users fetched from an external API.</p>
    </header>

    <main>
        <section aria-labelledby="directory-heading">
            <h2 id="directory-heading">Users</h2>

            <button id="load-users" type="button">Load Users</button>

            <p id="status" role="status" aria-live="polite">
                Click "Load Users" to get started.
            </p>

            <label for="filter-input">Filter users by name</label>
            <input
                type="search"
                id="filter-input"
                placeholder="Type a name..."
                disabled
            >

            <ul id="users-list"></ul>
        </section>
    </main>

    <footer>
        <p>User Directory — Day 5 Assignment</p>
    </footer>
</body>
</html>
